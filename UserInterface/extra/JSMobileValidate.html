<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #130e72, #b01bca);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }
        .title {
            text-align: center;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
        }
        .custom-alert {
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="title">📱 User Registration</h2>

    <div class="card p-4">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="text" id="mobile" class="form-control" placeholder="Enter 10-digit mobile number">
        </div>

        <div class="d-grid">
            <button class="btn btn-dark" onclick="validateForm()">Submit</button>
        </div>

        <!-- Message Box -->
        <div id="messageBox" class="mt-3 d-none"></div>
    </div>
</div>

<script>
function validateForm() {
    let name = document.getElementById("name").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let messageBox = document.getElementById("messageBox");

    // Mobile validation: only 10 digits
    let mobilePattern = /^[0-9]{10}$/;

    if (!name) {
        showMessage("⚠️ Please enter your name", "danger");
        return;
    }

    if (!mobilePattern.test(mobile)) {
        showMessage("❌ Mobile number must be exactly 10 digits", "danger");
        return;
    }

    showMessage("✅ Form submitted successfully!", "success");
}

function showMessage(message, type) {
    let messageBox = document.getElementById("messageBox");
    messageBox.className = "alert alert-" + type + " custom-alert mt-3";
    messageBox.innerText = message;
    messageBox.classList.remove("d-none");
}
</script>

</body>
</html>
