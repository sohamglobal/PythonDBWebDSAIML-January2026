<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SohamGlobal Account Search</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }
        .title {
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }
        .result-card {
            background: linear-gradient(to right, #43cea2, #185a9d);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="title">💳 SohamGlobal Account Lookup</h2>

    <div class="card p-4">
        <div class="row g-3">
            <div class="col-12 col-md-8">
                <input type="number" id="accno" class="form-control" placeholder="Enter Account Number (e.g. 1029)">
            </div>
            <div class="col-12 col-md-4 d-grid">
                <button class="btn btn-primary" onclick="searchAccount()">Search</button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result" class="result-card d-none">
            <h4>Account Details</h4>
            <p><span class="label">Account No:</span> <span id="r_accno"></span></p>
            <p><span class="label">Name:</span> <span id="r_name"></span></p>
            <p><span class="label">Type:</span> <span id="r_type"></span></p>
            <p><span class="label">Balance:</span> ₹ <span id="r_balance"></span></p>
        </div>

        <!-- Error -->
        <div id="error" class="alert alert-danger mt-3 d-none"></div>
    </div>
</div>

<script>
    function searchAccount() {
        let accno = document.getElementById("accno").value;

        if (!accno) {
            showError("Please enter account number");
            return;
        }

        let url = "http://sohamspring.azurewebsites.net/api/accounts/search/" + accno;

        fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error("Account not found");
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("result").classList.remove("d-none");
            document.getElementById("error").classList.add("d-none");

            document.getElementById("r_accno").innerText = data.accno;
            document.getElementById("r_name").innerText = data.accnm;
            document.getElementById("r_type").innerText = data.acctype;
            document.getElementById("r_balance").innerText = data.balance.toLocaleString();
        })
        .catch(error => {
            showError(error.message);
        });
    }

    function showError(message) {
        document.getElementById("error").innerText = message;
        document.getElementById("error").classList.remove("d-none");
        document.getElementById("result").classList.add("d-none");
    }
</script>

</body>
</html>
