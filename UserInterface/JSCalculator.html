<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        function add()
        {
            n1=parseInt(document.getElementById("num1").value);
            n2=parseInt(document.getElementById("num2").value);
            res=n1+n2
            document.getElementById("result").textContent="Sum is "+res;
        }
        function multiply()
        {
            n1=document.getElementById("num1").value;
            n2=document.getElementById("num2").value;
            res=n1*n2
            document.getElementById("result").textContent="Multiplication is "+res;
        }
    </script>

</head>
<body>
    <div class="container">
        <br><br>
        <h1 class="display-4">Javascript calculator</h1>
        <hr>
        <form>
            <table class="table">
                <tr>
                    <td>First Number</td>
                    <td><input type="text" name="num1" id="num1" class="form-control"></td>
                </tr>
                <tr>
                    <td>Second Number</td>
                    <td><input type="text" name="num2" id="num2" class="form-control"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="button" value="Add" class="btn btn-outline-primary" onclick="add()">
                        <input type="button" value="Multiply" class="btn btn-outline-secondary" onclick="multiply()">
                    </td>
                </tr>
            </table>
        </form>

        <span id="result">
            Result will appear here...
        </span>

    </div>
    
</body>
</html>
