<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        function calcSquare()
        {
            n=document.getElementById("num").value;
            sq=n*n
            document.getElementById("res").textContent="Square is "+sq
        }
        function clearAll()
        {
            document.getElementById("num").value="";
            document.getElementById("res").textContent="";
        }
    </script>
</head>
<body>
    <div class="container">
        <br><br>
        <h1 class="display-5">Square Calculator</h1>
        <hr>
        Number <input type="text" name="num" id="num" class="form-control">
        <input type="button" value="Show Square" class="btn btn-info" onclick="calcSquare()">
        <input type="button" value="Clear" class="btn btn-danger" onclick="clearAll()">
        <br><br>
        <span id="res"></span>
    </div>
    
</body>
</html>
