<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Customer Review</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f3d2e, #145a41, #1f7a5c);
            color: white;
        }

        header {
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            color: #d4f5e9;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, select, textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1f7a5c;
        }

        textarea {
            grid-column: span 2;
            resize: vertical;
            min-height: 120px;
        }

        .full-width {
            grid-column: span 2;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn {
            background: #1f7a5c;
            color: white;
        }

        .submit-btn:hover {
            background: #145a41;
        }

        .reset-btn {
            background: #ccc;
        }

        .reset-btn:hover {
            background: #aaa;
        }

        .back-btn {
            text-align: center;
            margin-top: 15px;
        }

        .back-btn a {
            color: #1f7a5c;
            text-decoration: none;
            font-weight: 600;
        }

        .back-btn a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        footer p {
            font-size: 13px;
            color: #d4f5e9;
        }
    </style>
</head>

<body>

<header>
    <h1>New Customer Review</h1>
    <p>Capture and analyze customer feedback effectively</p>
</header>

<div class="container">
    <div class="form-card">

        <h2><i class="fas fa-pen"></i> Add Review</h2>

        <form action="/addreview/" method="post">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label><i class="fas fa-user"></i> Customer Name</label>
                    <input type="text" name="customer_name" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-tags"></i> Product Category</label>
                    <input type="text" name="category" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-building"></i> Company</label>
                    <input type="text" name="company" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-cube"></i> Model Name</label>
                    <input type="text" name="model" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-rupee-sign"></i> Price</label>
                    <input type="number" name="price" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-globe"></i> Platform</label>
                    <input type="text" name="platform" placeholder="Amazon, Flipkart, Store..." required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-file-invoice"></i> Invoice Number</label>
                    <input type="text" name="invoice" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> Review Date</label>
                    <input type="date" name="review_date" required>
                </div>

                <div class="form-group full-width">
                    <label><i class="fas fa-comments"></i> Review Text</label>
                    <textarea name="review_text" placeholder="Write detailed customer feedback..." required></textarea>
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="btn submit-btn">
                    <i class="fas fa-save"></i> Submit Review
                </button>

                <button type="reset" class="btn reset-btn">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>

        </form>

        <div class="back-btn">
            <a href="/reviews/">← Back to Home</a>
        </div>

    </div>
</div>

<footer>
    <p><strong>SohamGlobal</strong> – Microsoft Partner | AI | Data Analytics | Training & Consulting</p>
    <p>Building intelligent feedback analysis systems.</p>
</footer>

</body>
</html>
