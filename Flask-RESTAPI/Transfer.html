<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Transfer</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #00b894);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 420px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(15px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        color: white;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .input-group {
        position: relative;
        margin-bottom: 25px;
    }

    .input-group input {
        width: 100%;
        padding: 14px 10px;
        border: none;
        border-bottom: 2px solid rgba(255,255,255,0.4);
        background: transparent;
        color: white;
        font-size: 16px;
        outline: none;
    }

    .input-group label {
        position: absolute;
        top: 14px;
        left: 10px;
        color: rgba(255,255,255,0.7);
        font-size: 14px;
        transition: 0.3s;
        pointer-events: none;
    }

    .input-group input:focus ~ label,
    .input-group input:valid ~ label {
        top: -10px;
        font-size: 12px;
        color: #00ffcc;
    }

    .input-group input:focus {
        border-bottom: 2px solid #00ffcc;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        background: linear-gradient(45deg, #00c9ff, #92fe9d);
        color: #003333;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .response {
        margin-top: 20px;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-weight: 500;
        display: none;
        animation: fadeIn 0.5s ease-in-out;
    }

    .success {
        background: rgba(0,255,150,0.15);
        border: 1px solid #00ff99;
    }

    .error {
        background: rgba(255,80,80,0.15);
        border: 1px solid #ff4d4d;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<div class="container">
    <h2>💸 Secure Transfer</h2>

    <div class="input-group">
        <input type="number" id="fromacc" required>
        <label>From Account Number</label>
    </div>

    <div class="input-group">
        <input type="number" id="toacc" required>
        <label>To Account Number</label>
    </div>

    <div class="input-group">
        <input type="number" id="amount" required>
        <label>Amount</label>
    </div>

    <button onclick="transferMoney()">Transfer Money</button>

    <div id="responseBox" class="response"></div>
</div>

<script>
function transferMoney() {
    let fromacc = document.getElementById("fromacc").value;
    let toacc = document.getElementById("toacc").value;
    let amount = document.getElementById("amount").value;

    let responseBox = document.getElementById("responseBox");

    // Validation
    if (!fromacc || !toacc || !amount) {
        showResponse("Please fill all fields", false);
        return;
    }

    let formData = new FormData();
    formData.append("fromacc", fromacc);
    formData.append("toacc", toacc);
    formData.append("amount", amount);

    fetch("http://127.0.0.1:5000/bank/transfer", {
        method: "PUT",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.message.includes("successful")) {
            showResponse("✅ " + data.message, true);
        } else {
            showResponse("❌ " + data.message, false);
        }
    })
    .catch(error => {
        showResponse("⚠️ Server error", false);
    });
}

function showResponse(msg, isSuccess) {
    let box = document.getElementById("responseBox");
    box.style.display = "block";
    box.innerHTML = msg;

    if (isSuccess) {
        box.className = "response success";
    } else {
        box.className = "response error";
    }
}
</script>

</body>
</html>
