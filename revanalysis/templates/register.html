<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f3d2e, #145a41, #1f7a5c);
            color: white;
        }

        header {
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            color: #d4f5e9;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1f7a5c;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #1f7a5c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #145a41;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #1f7a5c;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        footer p {
            font-size: 13px;
            color: #d4f5e9;
        }
    </style>
</head>

<body>

<header>
    <h1>User Registration</h1>
    <p>Create your account to access the Review Analysis System</p>
</header>

<div class="container">
    <div class="form-card">

        <h2><i class="fas fa-user-plus"></i> Register</h2>

        <form action="/adduser/" method="post">
            <!-- Django CSRF Token -->
            {% csrf_token %}

            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="userid" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mobile</label>
                <input type="tel" name="mobile" required autocomplete="off" pattern="[0-9]{10}" placeholder="10-digit mobile number">
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-user-check"></i> Register
            </button>
        </form>

        <div class="back-link">
            <a href="/reviews/">← Back to Home</a>
        </div>

    </div>
</div>

<footer>
    <p><strong>SohamGlobal</strong> – Microsoft Partner | AI | Data Analytics | Training & Consulting</p>
    <p>Empowering intelligent solutions for the future.</p>
</footer>

</body>
</html>
